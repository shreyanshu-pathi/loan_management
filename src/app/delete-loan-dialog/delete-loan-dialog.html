<h2 mat-dialog-title>Delete Loan</h2>

<mat-dialog-content>
    <p>Are you sure you want to delete this loan?</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-flat-button (click)="delete()">Delete</button>
    <button mat-raised-button (click)="cancel()">Cancel</button>
</mat-dialog-actions>
