<div class="addCustomer-container">

    <h2>Customer Form</h2>

    <form [formGroup]="customerForm">

        <!-- Customer name -->
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Customer Name</mat-label>
            <input matInput type="text" formControlName="name" placeholder="Enter customer name">
        </mat-form-field>

        <!-- Phone -->
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Customer Phone</mat-label>
            <input matInput type="tel" formControlName="phone" placeholder="Enter customer phone">
        </mat-form-field>

        <!-- Address -->
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Customer Address</mat-label>
            <input matInput type="text" formControlName="address" placeholder="Enter customer address">
        </mat-form-field>

        <!-- Notes -->
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Customer Notes (optional)</mat-label>
            <input matInput type="text" formControlName="notes" placeholder="Notes">
        </mat-form-field>

        <!-- Button -->
        <div class="btn">
            <button mat-flat-button (click)="save()">Save</button>
        </div>
    </form>

</div>
