<div class="home-container">

    <div class="dashboard-header">
        <div>
            <h1>Dashboard</h1>
            <p>Welcome to Loan Management System</p>
        </div>

        <div class="dashboard-btns">
            <button (click)="addCustomer()">Add</button>
            <button (click)="viewDetails()">View details</button>
        </div>
    </div>
</div>

<div class="dashboard-info">
    <div class="dashboard-card users">
        <p class="card-title" (click)="totalLoans()">Total Loans</p>
        <h2>{{ totalLoanCount }}</h2>

    </div>

    <div class="dashboard-card loans">
        <p class="card-title" (click)="addCustomer()">Create Loan</p>

    </div>
